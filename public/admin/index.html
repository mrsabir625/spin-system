<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel | Spin World Ceiling System</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#EDE6DA; --charcoal:#211F1C; --brass:#C89B5C; --plum:#4A4038; --offwhite:#F5F1E8; --line: rgba(237,230,218,0.14);
    --danger:#c85c5c; --safe:#7fae7a;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{ background:var(--charcoal); color:var(--offwhite); font-family:'Work Sans',sans-serif; min-height:100vh; }
  h1,h2{ font-family:'Fraunces',serif; }

  #login-screen{
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:24px; text-align:center; padding:20px;
  }
  #login-screen h1{ font-size:1.8rem; }
  #login-screen p{ color:var(--ivory); opacity:0.7; max-width:36ch; }
  #error-msg{ color:var(--danger); font-size:0.9rem; display:none; }

  #dashboard{ display:none; max-width:1100px; margin:0 auto; padding:30px 5vw 80px; }
  .top-bar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:30px; flex-wrap:wrap; gap:12px; }
  .top-bar h1{ font-size:1.6rem; }
  #logout-btn{ background:none; border:1px solid var(--line); color:var(--offwhite); padding:8px 16px; border-radius:20px; cursor:pointer; font-size:0.85rem; }
  #logout-btn:hover{ border-color:var(--brass); color:var(--brass); }

  .stat-row{ display:flex; gap:16px; margin-bottom:30px; flex-wrap:wrap; }
  .stat-card{ background:rgba(245,241,232,0.05); border:1px solid var(--line); border-radius:10px; padding:16px 22px; flex:1; min-width:140px; }
  .stat-card .num{ font-family:'Fraunces',serif; font-size:1.8rem; color:var(--brass); }
  .stat-card .label{ font-size:0.78rem; opacity:0.7; letter-spacing:0.05em; text-transform:uppercase; }

  section{ margin-bottom:40px; }
  section h2{ font-size:1.2rem; margin-bottom:14px; border-bottom:1px solid var(--line); padding-bottom:10px; }

  table{ width:100%; border-collapse:collapse; font-size:0.85rem; }
  th, td{ text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th{ color:var(--brass); font-weight:600; font-size:0.75rem; text-transform:uppercase; letter-spacing:0.05em; }
  tbody tr:hover{ background:rgba(245,241,232,0.04); }
  .table-wrap{ overflow-x:auto; }

  .btn{ border:none; border-radius:16px; padding:6px 14px; font-size:0.78rem; cursor:pointer; font-weight:500; }
  .btn-block{ background:var(--danger); color:#fff; }
  .btn-unblock{ background:var(--safe); color:#111; }
  .btn:hover{ opacity:0.85; }

  .empty{ opacity:0.5; font-size:0.85rem; padding:16px 0; }
  .refresh-note{ font-size:0.75rem; opacity:0.5; margin-top:8px; }
</style>
</head>
<body>

<div id="login-screen">
  <h1>Admin Panel</h1>
  <p>Only the site owner's Google account can access this dashboard.</p>
  <div id="g_id_signin"></div>
  <p id="error-msg"></p>
</div>

<div id="dashboard">
  <div class="top-bar">
    <h1>Spin World — Admin Panel</h1>
    <button id="logout-btn">Logout</button>
  </div>

  <div class="stat-row">
    <div class="stat-card"><div class="num" id="stat-total">0</div><div class="label">Visits Logged</div></div>
    <div class="stat-card"><div class="num" id="stat-unique">0</div><div class="label">Unique IPs</div></div>
    <div class="stat-card"><div class="num" id="stat-blocked">0</div><div class="label">Blocked IPs</div></div>
  </div>

  <section>
    <h2>Live Visitors</h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Time</th><th>IP</th><th>Device</th><th>Browser</th><th>OS</th><th>Page</th><th>Action</th></tr></thead>
        <tbody id="visitors-body"></tbody>
      </table>
    </div>
    <p class="refresh-note">Auto-refreshes every 5 seconds.</p>
  </section>

  <section>
    <h2>Blocked IPs</h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>IP</th><th>Blocked At</th><th>Action</th></tr></thead>
        <tbody id="blocked-body"></tbody>
      </table>
    </div>
  </section>
</div>

<script>
// IMPORTANT: paste the same Google Client ID here that you put in your .env file
const GOOGLE_CLIENT_ID = "156198707118-ht0f3tdvb5ioifn56fjtf2pkt7mddh38.apps.googleusercontent.com";

function showDashboard(){
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  loadData();
  setInterval(loadData, 5000);
}
function showLogin(errorText){
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('dashboard').style.display = 'none';
  const err = document.getElementById('error-msg');
  if(errorText){ err.textContent = errorText; err.style.display = 'block'; }
}

async function handleCredentialResponse(response){
  try{
    const res = await fetch('/api/auth/google', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ credential: response.credential })
    });
    const data = await res.json();
    if(res.ok){ showDashboard(); }
    else{ showLogin(data.error || 'This Google account is not authorized to access this panel.'); }
  } catch(err){
    showLogin('Something went wrong. Please try again.');
  }
}

window.onload = function(){
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: handleCredentialResponse
  });
  google.accounts.id.renderButton(document.getElementById('g_id_signin'), { theme: 'filled_black', size: 'large', shape: 'pill' });

  fetch('/api/auth/status').then(r => r.json()).then(data => {
    if(data.authenticated) showDashboard(); else showLogin();
  });
};

document.getElementById('logout-btn').addEventListener('click', async () => {
  await fetch('/api/auth/logout', { method: 'POST' });
  showLogin();
});

async function loadData(){
  const [visitorsRes, blockedRes] = await Promise.all([
    fetch('/api/admin/visitors'),
    fetch('/api/admin/blocked')
  ]);
  if(!visitorsRes.ok || !blockedRes.ok){ showLogin('Session expired, please sign in again.'); return; }
  const visitors = await visitorsRes.json();
  const blocked = await blockedRes.json();
  renderVisitors(visitors, blocked);
  renderBlocked(blocked);

  document.getElementById('stat-total').textContent = visitors.length;
  document.getElementById('stat-unique').textContent = new Set(visitors.map(v => v.ip)).size;
  document.getElementById('stat-blocked').textContent = blocked.length;
}

function renderVisitors(visitors, blocked){
  const body = document.getElementById('visitors-body');
  const blockedIps = new Set(blocked.map(b => b.ip));
  if(!visitors.length){ body.innerHTML = '<tr><td colspan="7" class="empty">No visits logged yet.</td></tr>'; return; }
  body.innerHTML = visitors.map(v => `
    <tr>
      <td>${new Date(v.time).toLocaleString()}</td>
      <td>${v.ip}</td>
      <td>${v.device} (${v.deviceType})</td>
      <td>${v.browser}</td>
      <td>${v.os}</td>
      <td>${v.path}</td>
      <td>${blockedIps.has(v.ip)
        ? `<button class="btn btn-unblock" onclick="unblockIp('${v.ip}')">Unblock</button>`
        : `<button class="btn btn-block" onclick="blockIp('${v.ip}')">Block</button>`}</td>
    </tr>
  `).join('');
}

function renderBlocked(blocked){
  const body = document.getElementById('blocked-body');
  if(!blocked.length){ body.innerHTML = '<tr><td colspan="3" class="empty">No IPs blocked.</td></tr>'; return; }
  body.innerHTML = blocked.map(b => `
    <tr>
      <td>${b.ip}</td>
      <td>${new Date(b.blockedAt).toLocaleString()}</td>
      <td><button class="btn btn-unblock" onclick="unblockIp('${b.ip}')">Unblock</button></td>
    </tr>
  `).join('');
}

async function blockIp(ip){
  await fetch('/api/admin/block', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ip}) });
  loadData();
}
async function unblockIp(ip){
  await fetch('/api/admin/unblock', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ip}) });
  loadData();
}
</script>
</body>
</html>
